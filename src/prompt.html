<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duplicate tab detected</title>
    <link rel="stylesheet" href="prompt.css" />
  </head>
  <body>
    <main class="prompt">
      <h1>Duplicate tab detected</h1>
      <p>
        You already have
        <strong id="label"></strong>
        open.
      </p>
      <p class="countdown">
        Switched to the existing tab. Closing this duplicate in
        <strong id="countdown"></strong>s.
      </p>
      <div class="actions">
        <button id="cancel" type="button" class="primary">
          Keep new tab
        </button>
      </div>
    </main>
    <script src="prompt-page.js"></script>
  </body>
</html>
